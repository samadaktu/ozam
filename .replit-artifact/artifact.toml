kind = "web"
previewPath = "/"
title = "OZMA - AI Automation Agency"
version = "1.0.0"
id = "artifacts/ozma"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21741

[services.development]
run = "pnpm --filter @workspace/ozma run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ozma", "run", "build" ]
publicDir = "artifacts/ozma/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21741"
BASE_PATH = "/"
